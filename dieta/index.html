<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="La dieta"><meta name="theme-color" content="#345b42"><meta name="robots" content="noindex,nofollow"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="favicon.svg"><link rel="manifest" href="manifest.webmanifest"><title>La dieta · Prueba móvil</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f7f2;color:#253c32;font-family:system-ui,sans-serif}form{max-width:390px;margin:12vh auto;padding:28px}h1{font-size:36px;letter-spacing:-1px}p{line-height:1.6;color:#647263}label{display:block;font-size:14px;font-weight:600}input{display:block;width:100%;padding:15px;border:1px solid #ccd6c5;border-radius:12px;font:inherit;margin:10px 0 18px}button{width:100%;padding:15px;background:#345b42;color:white;border:0;border-radius:12px;font:inherit;font-weight:600}button:disabled{opacity:.5}#error{color:#a04432}iframe{border:0;display:block;position:fixed;inset:0;width:100%;height:100%;height:100dvh;background:#f7f7f2}</style></head><body><form id="gate"><h1>La dieta.</h1><p>Vuestra calculadora, preparada para el móvil. Introduce vuestro PIN de cuatro cifras para entrar.</p><label>PIN de acceso<input id="password" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" placeholder="••••" aria-label="PIN de acceso de cuatro cifras" required></label><button id="open">Abrir la aplicación</button><p id="error" role="alert"></p><p><small>En esta prueba los platos se guardan en este dispositivo. La sincronización entre móviles sigue pendiente.</small></p></form><script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js',{scope:'./',updateViaCache:'none'}).catch(()=>{});
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));let payload;
async function launch(key){const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(payload.iv)},key,decode(payload.cipher));const frame=document.createElement('iframe');frame.title='La aplicación de la dieta';frame.srcdoc=new TextDecoder().decode(plain);document.body.replaceChildren(frame);}
async function data(){if(!payload){const r=await fetch('./payload.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('No se ha podido cargar. Recarga la página con conexión.');payload=await r.json();}return payload;}
try{sessionStorage.removeItem('diet.preview.key');}catch{}
document.getElementById('password').addEventListener('input',e=>{e.target.value=e.target.value.replace(/[^0-9]/g,'').slice(0,4);if(e.target.value.length===4&&!document.getElementById('open').disabled)document.getElementById('gate').requestSubmit();});
document.getElementById('gate').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('open');if(button.disabled)return;button.disabled=true;document.getElementById('error').textContent='';try{await data();const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('password').value.trim()),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(payload.salt),iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);await launch(key);}catch{document.getElementById('error').textContent='PIN incorrecto o sin conexión. Vuelve a intentarlo.';document.getElementById('password').value='';button.disabled=false;document.getElementById('password').focus();}});
</script></body></html>
